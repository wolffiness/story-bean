name: Lint, format, and validate-html

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/composite/npm

      - run: npm run lint
  format:
    name: Run formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/composite/npm

      - run: npm run format
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/composite/npm

      - run: npx nuxt generate
